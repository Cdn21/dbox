# Rien pour le mainteneur solo — les tests et le typecheck tournent déjà à la
# main avant chaque déploiement. Ce workflow sert le jour où quelqu'un d'autre
# ouvre une pull request : un signal avant même de la relire.
name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
