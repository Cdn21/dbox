# Miroir public (GitHub) uniquement : la CI qui compte tourne sur la forge
# Forgejo (.forgejo/workflows/ci.yml), à chaque push, et c'est elle qui fait
# avancer la production. Ce workflow-ci sert le jour où quelqu'un ouvre une pull
# request sur le miroir : un signal avant même de la relire.
name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
